<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
<title>Brak połączenia z internetem — Alertownik</title>
<style>
  /* Sprint 162 — this page has no app JavaScript (SW-cached fallback, must
     work standalone), so dark mode here is primarily prefers-color-scheme
     driven. The tiny inline script below (no framework, no app bundle) only
     adds one thing on top: honoring a manual light/dark override the user
     already made in the app, by toggling this same class. Falls back to
     the media query alone if that script doesn't run for any reason. */
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #f0f9ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
  }
  main {
    max-width: 420px;
    width: 100%;
    background: #ffffff;
    border: 1px solid #dbeafe;
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #2563eb;
    margin-bottom: 16px;
  }
  .badge span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ffffff;
    display: block;
  }
  h1 {
    font-size: 18px;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    line-height: 1.6;
    color: #475569;
    margin: 0 0 12px;
  }
  .muted {
    font-size: 12px;
    color: #94a3b8;
    margin: 16px 0 0;
  }
  button {
    appearance: none;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { background: #1d4ed8; }
  button:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }

  /* The inline script below only ever adds "au-dark"/"au-light" to <html>
     (never to <body>) — every selector here keys off html's class, never
     body's, so there's exactly one source of truth for "is an override
     active" per rule. */
  @media (prefers-color-scheme: dark) {
    html:not(.au-light) body { background: #0b1220; }
    html:not(.au-light) main { background: #111827; border-color: #293548; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); }
    html:not(.au-light) h1 { color: #f1f5f9; }
    html:not(.au-light) p { color: #cbd5e1; }
    html:not(.au-light) .muted { color: #94a3b8; }
  }
  html.au-dark body { background: #0b1220; }
  html.au-dark main { background: #111827; border-color: #293548; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); }
  html.au-dark h1 { color: #f1f5f9; }
  html.au-dark p { color: #cbd5e1; }
  html.au-dark .muted { color: #94a3b8; }
</style>
<script>
  // Mirrors the resolution logic in src/app/theme-bootstrap-script.tsx and
  // src/lib/theme.ts (duplicated on purpose — this page can't import app
  // modules). Adds "au-dark"/"au-light" so a manual override wins over the
  // media query above; if this throws for any reason, the plain
  // prefers-color-scheme rules above still apply.
  (function () {
    try {
      var stored = localStorage.getItem("alertownik-theme-preference");
      if (stored === "dark") {
        document.documentElement.classList.add("au-dark");
      } else if (stored === "light") {
        document.documentElement.classList.add("au-light");
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
  <main>
    <span class="badge"><span></span></span>
    <h1>Brak połączenia z internetem</h1>
    <p>
      Alertownik nie może teraz pobrać aktualnych komunikatów. Połącz się z
      internetem, aby sprawdzić najnowsze alerty.
    </p>
    <p>
      Ze względów bezpieczeństwa nie pokazujemy tu starych alertów jako
      aktualnych — mogłyby już nie być prawdziwe.
    </p>
    <button type="button" onclick="location.reload()">Spróbuj ponownie</button>
    <p class="muted">Alertownik</p>
  </main>
</body>
</html>
