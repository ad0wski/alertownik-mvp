<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
<title>Brak połączenia z internetem — Alertownik</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #f0f9ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    min-height: 100vh;
  }
  main {
    max-width: 420px;
    width: 100%;
    background: #ffffff;
    border: 1px solid #dbeafe;
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: #2563eb;
    margin-bottom: 16px;
  }
  .badge span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ffffff;
    display: block;
  }
  h1 {
    font-size: 18px;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    line-height: 1.6;
    color: #475569;
    margin: 0 0 12px;
  }
  .muted {
    font-size: 12px;
    color: #94a3b8;
    margin: 16px 0 0;
  }
  button {
    appearance: none;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { background: #1d4ed8; }
  button:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <span class="badge"><span></span></span>
    <h1>Brak połączenia z internetem</h1>
    <p>
      Alertownik nie może teraz pobrać aktualnych komunikatów. Połącz się z
      internetem, aby sprawdzić najnowsze alerty.
    </p>
    <p>
      Ze względów bezpieczeństwa nie pokazujemy tu starych alertów jako
      aktualnych — mogłyby już nie być prawdziwe.
    </p>
    <button type="button" onclick="location.reload()">Spróbuj ponownie</button>
    <p class="muted">Alertownik</p>
  </main>
</body>
</html>
